name: Frontend

on:
  workflow_call:
    secrets:
      SUPABASE_ANON_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: ./.github/actions/setup-supabase

      - name: Apply CI Supabase config
        run: cp supabase/config.ci.toml supabase/config.toml

      - name: Start Supabase
        run: supabase start
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Write .env.local
        run: |
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          # Fall back to the local default anon key if secret is not set
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY // empty' 2>/dev/null || echo "")
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" > frontend/.env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> frontend/.env.local

      - name: Run Playwright E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

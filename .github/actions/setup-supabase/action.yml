name: Setup Supabase CLI
description: 'Install the latest Supabase CLI and add it to PATH'

runs:
  using: "composite"
  steps:
    - uses: supabase/setup-cli@v1
      with:
        # Pinned to match local dev. Newer versions ship a Realtime container
        # that dropped the cainophile WAL slot for postgres_changes, breaking
        # E2E Realtime delivery. Upgrade together with a migration for the new
        # Realtime architecture (realtime.send() triggers).
        version: 2.75.0
